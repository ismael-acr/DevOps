<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Horas Médicas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Centro Médico San Rafael</h1>
            <h2>Reserva de Horas Médicas</h2>
            <p class="service-status">Estado del servicio: <strong>Operativo</strong></p>
        </header>

        <form action="#" method="get" class="reservation-form">
            <div class="form-group">
                <label for="rut">RUT del Paciente:</label>
                <input type="text" id="rut" name="rut" placeholder="Ej: 12.345.678-9" required>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
            </div>

            <div class="form-group">
                <label for="especialidad">Especialista / Área Médica:</label>
                <select id="especialidad" name="especialidad" required>
                    <option value="">Seleccione una especialidad</option>
                    <option value="medicina-general">Medicina General</option>
                    <option value="cardiologia">Cardiología</option>
                    <option value="pediatria">Pediatría</option>
                    <option value="traumatologia">Traumatología</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de Reserva:</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="form-group">
                <label for="hora">Horario de Atención:</label>
                <input type="time" id="hora" name="hora" min="08:00" max="18:00" required>
            </div>

            <button type="submit" class="btn-submit">Confirmar Reserva</button>
        </form>
    </main>
</body>
</html>
